[package]
name = "liberty-messenger"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Liberty Messenger V2 core — post-quantum E2EE, P2P, desktop"

[lib]
name = "liberty_messenger"
path = "src/lib.rs"

[[bin]]
name = "liberty-messenger"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
futures = { version = "0.3", optional = true }

aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
zeroize = "1.6"
base64 = "0.22"

image = { version = "0.24", optional = true }
pqc_kyber = { version = "0.7.1", optional = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }

libp2p = { version = "0.53", optional = true, default-features = false, features = [
  "gossipsub", "tcp", "noise", "yamux", "tokio", "macros", "identify", "ping"
] }

[features]
default = []
kyber = ["dep:pqc_kyber"]
stego = ["dep:image"]
p2p = ["dep:libp2p", "dep:futures"]
ai = ["dep:reqwest"]
web3 = ["dep:reqwest"]
desktop = []
