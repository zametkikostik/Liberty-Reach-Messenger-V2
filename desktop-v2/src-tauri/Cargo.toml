[package]
name = "liberty-desktop"
version = "2.0.0"
description = "Liberty Messenger V2 — Tauri 2 desktop shell"
authors = ["Liberty Messenger Team"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Re-use core crypto when workspace path is available
# liberty-messenger = { path = "../../messenger", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
