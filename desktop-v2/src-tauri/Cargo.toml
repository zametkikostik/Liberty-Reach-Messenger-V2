[package]
name = "liberty-desktop"
version = "2.0.0"
description = "Liberty Messenger V2 — Tauri 2 desktop shell"
authors = ["Liberty Messenger Team"]
edition = "2021"
license = "MIT"

[lib]
name = "liberty_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liberty-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
